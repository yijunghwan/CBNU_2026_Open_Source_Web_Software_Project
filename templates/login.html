<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ALL IN ONE</title>
    <meta name="description" content="동아리 통합 게시판 ALL IN ONE 로그인 페이지">
    <style>
        /* =========================================
           [1. 기본 설정 및 커스텀 커서]
           main.html과 동일한 커서 스타일을 적용합니다.
        ========================================= */
        * {
            cursor: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            color: #eee;
            overflow: hidden;
            /* 로그인 페이지는 스크롤 없이 한 화면에 꽉 차게 */
            height: 100vh;
        }

        /* =========================================
           [2. 커스텀 네온 커서 - main.html과 동일]
        ========================================= */
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: #00d4ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
        }

        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* =========================================
           [3. 네비게이션 바 - main.html과 동일한 글래스모피즘]
        ========================================= */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        nav .menu {
            display: flex;
            gap: 40px;
        }

        nav .menu a {
            color: #ccc;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: color 0.3s;
            position: relative;
        }

        nav .menu a:hover {
            color: #fff;
        }

        nav .menu a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 2px;
            background: #00d4ff;
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        nav .menu a:hover::after {
            width: 100%;
            box-shadow: 0 0 8px #00d4ff;
        }

        nav .menu a.active {
            color: #00d4ff;
        }

        nav .menu a.active::after {
            width: 100%;
            box-shadow: 0 0 8px #00d4ff;
        }

        /* =========================================
           [4. 전체 레이아웃 - Three.js 캔버스 + 로그인 카드 오버레이]
        ========================================= */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #login-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* =========================================
           [5. 로그인 카드 - main.html의 .board 스타일을 계승]
        ========================================= */
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 50px 45px;
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.75), rgba(10, 10, 10, 0.75));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 212, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);

            /* 등장 애니메이션 */
            opacity: 0;
            transform: translateY(30px) scale(0.97);
            animation: cardAppear 0.8s 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 카드 상단 로고 + 타이틀 */
        .card-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .card-logo {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 14px;
            opacity: 0;
            animation: fadeUp 0.6s 0.6s forwards;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.6s 0.75s forwards;
        }

        /* 제목 아래 네온 그라데이션 밑줄 - main.html의 .board h2::after 계승 */
        .card-title::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
            border-radius: 2px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           [6. 폼 요소 스타일]
        ========================================= */
        .form-group {
            margin-bottom: 22px;
            opacity: 0;
            animation: fadeUp 0.6s forwards;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.9s;
        }

        .form-group:nth-child(2) {
            animation-delay: 1.0s;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-group input:focus {
            border-color: rgba(0, 212, 255, 0.6);
            background: rgba(0, 212, 255, 0.04);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), 0 0 15px rgba(0, 212, 255, 0.1);
        }

        /* =========================================
           [7. 로그인 버튼 - 네온 그라데이션]
        ========================================= */
        .btn-login {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.3s;

            opacity: 0;
            animation: fadeUp 0.6s 1.1s forwards;
        }

        /* 버튼 위에 마우스를 올리면 빛나는 hover 레이어 */
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            transition: left 0.4s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4), 0 0 40px rgba(255, 0, 200, 0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* =========================================
           [8. 회원가입 링크]
        ========================================= */
        .card-footer {
            text-align: center;
            margin-top: 28px;
            color: #666;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeUp 0.6s 1.2s forwards;
        }

        .card-footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .card-footer a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        /* =========================================
           [9. 에러 메시지]
        ========================================= */
        .error-msg {
            display: none;
            background: rgba(255, 60, 60, 0.1);
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            color: #ff6b6b;
            font-size: 0.88rem;
            margin-bottom: 18px;
            text-align: center;
        }

        .error-msg.show {
            display: block;
        }

        /* =========================================
           [10. 반응형]
        ========================================= */
        @media (max-width: 480px) {
            nav {
                padding: 0 24px;
            }

            nav .menu {
                gap: 20px;
            }

            .login-card {
                margin: 0 20px;
                padding: 36px 28px;
            }
        }
    </style>
</head>

<body>

    <!-- 커스텀 커서 - main.html과 동일 -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- 네비게이션 바 - main.html과 동일 -->
    <nav>
        <a href="/" class="logo">ALL IN ONE</a>
        <div class="menu">
            <a href="/">홈</a>
            <a href="/auth/login" class="active">로그인</a>
            <a href="#" onclick="alert('로그인 후 이용해주세요.')">게시판</a>
            <a href="#" onclick="alert('로그인 후 이용해주세요.')">회의실</a>
            <a href="#" onclick="alert('로그인 후 이용해주세요.')">마이페이지</a>
        </div>
    </nav>

    <!-- Three.js 파티클 배경 (main.html과 동일한 분위기) -->
    <div id="canvas-container"></div>

    <!-- 로그인 카드 -->
    <div id="login-wrapper">
        <div class="login-card">
            <div class="card-header">
                <div class="card-logo">ALL IN ONE</div>
                <h1 class="card-title">로그인</h1>
            </div>

            <!-- 에러 메시지 영역 -->
            <div class="error-msg" id="errorMsg">아이디 또는 비밀번호를 확인해주세요.</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="user_id">아이디</label>
                    <input type="text" name="user_id" id="user_id" placeholder="아이디를 입력하세요" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password">
                </div>

                <button type="button" class="btn-login" id="loginBtn" onclick="login()">
                    로그인
                </button>
            </form>

            <div class="card-footer">
                계정이 없으신가요?&nbsp;
                <a href="{{ url_for('auth.register') }}">회원가입</a>
            </div>
        </div>
    </div>

    <!-- Three.js (main.html과 동일한 CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* =========================================
           [JavaScript 파트 1] 커스텀 커서 로직 - main.html과 동일
        ========================================= */
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = `${e.clientX}px`;
            cursorDot.style.top = `${e.clientY}px`;

            cursorOutline.animate({
                left: `${e.clientX}px`,
                top: `${e.clientY}px`
            }, { duration: 500, fill: "forwards" });
        });

        /* 인풋 위에서는 커서를 원래대로 보여주기 */
        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursorDot.style.opacity = '0.4';
            });
            el.addEventListener('mouseleave', () => {
                cursorDot.style.opacity = '1';
            });
        });

        /* =========================================
           [JavaScript 파트 2] Three.js 파티클 배경
           main.html의 파티클과 동일하지만 좀 더 잔잔하게 세팅합니다.
        ========================================= */
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.04);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 18;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        /* --- 파티클(별가루) 배경 - main.html과 동일 --- */
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1200;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 60;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.07,
            color: 0x00d4ff,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        /* --- 분홍 보조 파티클 레이어 --- */
        const posArray2 = new Float32Array(600 * 3);
        for (let i = 0; i < 600 * 3; i++) posArray2[i] = (Math.random() - 0.5) * 70;
        const geo2 = new THREE.BufferGeometry();
        geo2.setAttribute('position', new THREE.BufferAttribute(posArray2, 3));
        const mat2 = new THREE.PointsMaterial({
            size: 0.05, color: 0xff00c8,
            transparent: true, opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(geo2, mat2));

        /* --- 원형으로 배치된 홀로그램 링 오브젝트 (배경 분위기용) --- */
        const ringGroup = new THREE.Group();
        scene.add(ringGroup);

        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const geo = new THREE.TorusGeometry(1.2 + Math.random() * 0.5, 0.02, 8, 60);
            const mat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(i / 8, 1, 0.5),
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(geo, mat);
            ring.position.x = Math.cos(angle) * 12;
            ring.position.z = Math.sin(angle) * 12;
            ring.position.y = Math.sin(angle * 2) * 2;
            ring.rotation.x = Math.PI / 2;
            ringGroup.add(ring);
        }

        /* --- 애니메이션 루프 --- */
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            particlesMesh.rotation.y = t * 0.04;
            particlesMesh.position.y = Math.sin(t * 0.4) * 1.5;

            ringGroup.rotation.y = t * 0.06;
            ringGroup.children.forEach((ring, idx) => {
                ring.position.y = Math.sin(t * 1.2 + idx) * 1.5;
                ring.rotation.z = t * 0.3 + idx;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        /* =========================================
           [JavaScript 파트 3] 로그인 로직 - 기존 코드 유지
        ========================================= */
        function login() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.remove('show');

            let form = document.getElementById('loginForm');
            let formData = new FormData(form);

            fetch('/auth/login', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/user/mypage';
                    } else {
                        errorMsg.textContent = data.message || '아이디 또는 비밀번호를 확인해주세요.';
                        errorMsg.classList.add('show');
                    }
                })
                .catch(() => {
                    errorMsg.textContent = '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
                    errorMsg.classList.add('show');
                });
        }

        /* 엔터 키로 로그인 */
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('user_id').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
    </script>
</body>

</html>
