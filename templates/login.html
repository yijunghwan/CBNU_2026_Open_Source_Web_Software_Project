<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ALL IN ONE</title>
    <meta name="description" content="동아리 통합 게시판 ALL IN ONE 로그인 페이지">
    <link rel="stylesheet" href="/static/loginPage_/login.css">
</head>

<body>

    <!-- 커스텀 커서 - main.html과 동일 -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    {% set active_page = 'login' %}
    <!-- 이정환이 고친 부분: 로그인페이지에도 공통 네비게이션바를 넣었습니다. -->
    {% include '_navbar.html' %}

    <!-- Three.js 파티클 배경 (main.html과 동일한 분위기) -->
    <div id="canvas-container"></div>

    <!-- 로그인 카드 -->
    <div id="login-wrapper">
        <div class="login-card">
            <div class="card-header">
                <div class="card-logo">ALL IN ONE</div>
                <h1 class="card-title">로그인</h1>
            </div>

            <!-- 에러 메시지 영역 -->
            <div class="error-msg" id="errorMsg">아이디 또는 비밀번호를 확인해주세요.</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="user_id">아이디</label>
                    <input type="text" name="user_id" id="user_id" placeholder="아이디를 입력하세요" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password">
                </div>

                <button type="button" class="btn-login" id="loginBtn" onclick="login()">
                    로그인
                </button>
            </form>

            <div class="card-footer">
                계정이 없으신가요?&nbsp;
                <a href="{{ url_for('auth.register') }}">회원가입</a>
            </div>
        </div>
    </div>

    <!-- Three.js (main.html과 동일한 CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/loginPage_/login.js"></script>
</body>

</html>
