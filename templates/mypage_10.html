<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 (동아리원) - ALL IN ONE</title>
    <meta name="description" content="ALL IN ONE 마이페이지 - 동아리원 정보 및 계정 관리">
    <link rel="stylesheet" href="{{ url_for('static', filename='mypage.css') }}">
</head>

<body>
    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}

    <div class="page-container">
        <!-- 페이지 헤더 -->
        <div class="page-header">
            <h1>{{ user.name }}님의 마이페이지</h1>
            <div class="user-meta">
                <span>아이디: {{ user.user_id }}</span>
                <span>학번: {{ user.student_id }}</span>
                <span>레벨: {{ user.role_level }}</span>
            </div>
        </div>

        <!-- 동아리 소속 카드 -->
        <div class="card">
            <div class="card-title">동아리 소속 정보</div>
            <div class="info-row">
                <span class="info-label">소속 동아리</span>
                <span class="info-value">{{ user.belonging_club }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">동아리 인원</span>
                <span class="member-count-badge">{{ count }}명</span>
            </div>
            <div class="action-row">
                <button class="btn btn-danger" type="button" onclick="leaveClub()">동아리 탈퇴하기</button>
            </div>
        </div>

        <!-- 계정 관리 카드 -->
        <div class="card">
            <div class="card-title">계정 관리</div>
            <div class="action-row">
                <button class="btn btn-outline" onclick="location.href='/user/change_info'">내 정보 수정</button>
                <button class="btn btn-outline" onclick="location.href='/board/my-posts'">내가 쓴 글</button>
                <button class="btn btn-ghost" onclick="location.href='/auth/logout'">로그아웃</button>
            </div>
        </div>
    </div>

    <script>
        function leaveClub() {
            if (confirm('정말 동아리를 탈퇴하시겠습니까?')) {
                fetch('/user/leave_club_10', {
                    method: 'POST'
                })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }
        }
    </script>
</body>

</html>
