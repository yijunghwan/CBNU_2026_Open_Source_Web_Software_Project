<link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
<script src="{{ url_for('static', filename='navbar.js') }}" defer></script>

<nav class="app-navbar" aria-label="주요 네비게이션">
    <a href="/" class="logo">ALL IN ONE</a>
    <div class="menu">
        <div class="dropdown" id="board-dropdown">
            <a href="#" class="dropdown-toggle" id="board-toggle" onclick="toggleDropdown(event, 'board-dropdown')">
                게시판 <span class="arrow">▼</span>
            </a>
            <div class="dropdown-menu">
                {% if session.get('id') %}
                <a href="{{ url_for('board.myclub') }}">자기 동아리 게시판</a>
                <div class="dropdown-divider"></div>
                {% endif %}

                <!-- navbar_clubs db여부 확인 -->
                {% if navbar_clubs %}
                <!-- 반복문 app.py의 전역변수인 navbar_clubs db의 정보를 club에 넣고 돌리기 -->
                {% for club in navbar_clubs %}
                <a href="{{ url_for('board.other_club', club_name=club.name) }}">{{ club.name }}</a>
                {% endfor %}
                <div class="dropdown-divider"></div>
                {% endif %}
                <a href="{{ url_for('board.all_board') }}">전체 게시판</a>
            </div>
        </div>

        <a href="{{ url_for('meeting.meeting_page') }}">회의실</a>
        <a href="{{ url_for('promotion.list_posts') }}">홍보게시판</a>

        {% if session.get('id') %}
        <a href="/user/mypage">마이페이지</a>
        <a href="/auth/logout">로그아웃</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="{% if active_page == 'login' %}active{% endif %}">로그인</a>
        <a href="{{ url_for('auth.register') }}" class="{% if active_page == 'register' %}active{% endif %}">회원가입</a>
        {% endif %}
    </div>
</nav>
