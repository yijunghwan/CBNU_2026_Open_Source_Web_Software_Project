<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - ALL IN ONE</title>
    <meta name="description" content="동아리 통합 게시판 ALL IN ONE 회원가입 페이지">
    <style>
        /* =========================================
           [1. 기본 설정 및 커스텀 커서]
        ========================================= */
        * {
            cursor: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            color: #eee;
            /* 회원가입 카드는 필드가 많아 세로 스크롤이 필요합니다. */
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }

        /* =========================================
           [2. 커스텀 네온 커서 - login.html과 동일]
        ========================================= */
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: #00d4ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
        }

        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* =========================================
           [3. 네비게이션 바 - login.html과 동일한 글래스모피즘]
        ========================================= */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        nav .menu {
            display: flex;
            gap: 40px;
        }

        nav .menu a {
            color: #ccc;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: color 0.3s;
            position: relative;
        }

        nav .menu a:hover {
            color: #fff;
        }

        nav .menu a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 2px;
            background: #00d4ff;
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        nav .menu a:hover::after {
            width: 100%;
            box-shadow: 0 0 8px #00d4ff;
        }

        nav .menu a.active {
            color: #00d4ff;
        }

        nav .menu a.active::after {
            width: 100%;
            box-shadow: 0 0 8px #00d4ff;
        }

        /* =========================================
           [4. 전체 레이아웃 - Three.js 캔버스 + 카드 오버레이]
        ========================================= */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 회원가입 카드 래퍼:
           필드가 많아 스크롤이 필요하므로 fixed 대신
           세로 패딩을 주어 nav 아래부터 시작하게 합니다. */
        #register-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 100px 20px 60px;
        }

        /* =========================================
           [5. 회원가입 카드 - login.html의 .login-card 계승]
        ========================================= */
        .register-card {
            width: 100%;
            max-width: 520px;
            padding: 50px 45px;
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.75), rgba(10, 10, 10, 0.75));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 212, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);

            /* 등장 애니메이션 */
            opacity: 0;
            transform: translateY(30px) scale(0.97);
            animation: cardAppear 0.8s 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 카드 상단 로고 + 타이틀 */
        .card-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .card-logo {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 14px;
            opacity: 0;
            animation: fadeUp 0.6s 0.6s forwards;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.6s 0.75s forwards;
        }

        /* 제목 아래 네온 그라데이션 밑줄 */
        .card-title::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
            border-radius: 2px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           [6. 폼 구분선 (섹션 제목)]
           10개의 필드를 시각적으로 그룹화하는 구분 요소입니다.
        ========================================= */
        .form-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00d4ff;
            opacity: 0.7;
            margin: 28px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section-title::before,
        .form-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.3), transparent);
        }

        .form-section-title::before {
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3));
        }

        .form-section-title:first-of-type {
            margin-top: 8px;
        }

        /* =========================================
           [7. 폼 요소 스타일 - login.html과 동일]
        ========================================= */
        .form-group {
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.5s forwards;
        }

        /* 10개 필드를 순차적으로 등장시킵니다. */
        .form-group:nth-child(1) {
            animation-delay: 0.85s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.92s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.99s;
        }

        .form-group:nth-child(4) {
            animation-delay: 1.06s;
        }

        .form-group:nth-child(5) {
            animation-delay: 1.13s;
        }

        .form-group:nth-child(6) {
            animation-delay: 1.20s;
        }

        .form-group:nth-child(7) {
            animation-delay: 1.27s;
        }

        .form-group:nth-child(8) {
            animation-delay: 1.34s;
        }

        .form-group:nth-child(9) {
            animation-delay: 1.41s;
        }

        .form-group:nth-child(10) {
            animation-delay: 1.48s;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 7px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.97rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-group input:focus {
            border-color: rgba(0, 212, 255, 0.6);
            background: rgba(0, 212, 255, 0.04);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), 0 0 15px rgba(0, 212, 255, 0.1);
        }

        /* 두 개의 필드를 한 행에 나란히 배치하는 그리드 레이아웃 */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* =========================================
           [8. 가입하기 버튼 - login.html의 .btn-login 계승]
        ========================================= */
        .btn-register {
            width: 100%;
            padding: 15px;
            margin-top: 14px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.3s;
            opacity: 0;
            animation: fadeUp 0.6s 1.55s forwards;
        }

        /* 마우스를 올리면 빛이 쓸고 지나가는 샤인 효과 */
        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            transition: left 0.4s ease;
        }

        .btn-register:hover::before {
            left: 100%;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4), 0 0 40px rgba(255, 0, 200, 0.2);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        /* =========================================
           [9. 로그인 링크 (카드 하단)]
        ========================================= */
        .card-footer {
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeUp 0.6s 1.65s forwards;
        }

        .card-footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .card-footer a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        /* =========================================
           [10. 반응형]
        ========================================= */
        @media (max-width: 600px) {
            nav {
                padding: 0 24px;
            }

            nav .menu {
                gap: 16px;
            }

            .register-card {
                padding: 36px 24px;
            }

            /* 모바일에서는 2열 그리드를 1열로 변경합니다. */
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- 커스텀 커서 - login.html과 동일 -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- 네비게이션 바 - login.html과 동일 -->
    <nav>
        <a href="/" class="logo">ALL IN ONE</a>
        <div class="menu">
            <a href="/">홈</a>
            <a href="{{ url_for('auth.login') }}">로그인</a>
            <a href="#" onclick="alert('로그인 후 이용해주세요.')">게시판</a>
            <a href="#" onclick="alert('로그인 후 이용해주세요.')">회의실</a>
            <a href="#" onclick="alert('로그인 후 이용해주세요.')">마이페이지</a>
        </div>
    </nav>

    <!-- Three.js 파티클 배경 -->
    <div id="canvas-container"></div>

    <!-- 회원가입 카드 -->
    <div id="register-wrapper">
        <div class="register-card">

            <!-- 카드 헤더: 로고 + 제목 -->
            <div class="card-header">
                <div class="card-logo">ALL IN ONE</div>
                <h1 class="card-title">회원가입</h1>
            </div>

            <!-- ======================================================
                 아래 <form id="registerForm">과 <script>의 register()
                 함수는 원본 코드 그대로 보존합니다.
                 디자인 요소(CSS 클래스, label, placeholder)만 추가했습니다.
            ====================================================== -->
            <form id="registerForm">

                <!-- 계정 정보 섹션 -->
                <div class="form-section-title">계정 정보</div>

                <div class="form-group">
                    <label for="user_id">아이디</label>
                    <input type="text" name="user_id" id="user_id" placeholder="사용할 아이디를 입력하세요">
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요">
                </div>

                <!-- 개인 정보 섹션 -->
                <div class="form-section-title">개인 정보</div>

                <!-- 이름 + 나이를 한 행에 나란히 배치 -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" name="name" id="name" placeholder="홍길동">
                    </div>
                    <div class="form-group">
                        <label for="age">나이</label>
                        <input type="number" name="age" id="age" placeholder="예: 22">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">연락처</label>
                    <input type="text" name="phone" id="phone" placeholder="010-0000-0000">
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" name="email" id="email" placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="address">거주지 주소</label>
                    <input type="text" name="address" id="address" placeholder="주소를 입력하세요">
                </div>

                <!-- 학적 정보 섹션 -->
                <div class="form-section-title">학적 정보</div>

                <div class="form-group">
                    <label for="student_id">학번</label>
                    <input type="text" name="student_id" id="student_id" placeholder="예: 20261234">
                </div>

                <!-- 학년 + 입학년도를 한 행에 나란히 배치 -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="grade">학년</label>
                        <input type="number" name="grade" id="grade" placeholder="1 ~ 4">
                    </div>
                    <div class="form-group">
                        <label for="admission_year">입학년도</label>
                        <input type="number" name="admission_year" id="admission_year" placeholder="예: 2026">
                    </div>
                </div>

                <!-- 가입하기 버튼: onclick="register()" 원본 그대로 유지 -->
                <button type="button" class="btn-register" onclick="register()">
                    가입하기
                </button>
            </form>

            <div class="card-footer">
                이미 계정이 있으신가요?&nbsp;
                <a href="/auth/login">로그인</a>
            </div>
        </div>
    </div>

    <!-- Three.js (login.html과 동일한 CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* =========================================
           [JavaScript 파트 1] 커스텀 커서 로직 - login.html과 동일
        ========================================= */
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = `${e.clientX}px`;
            cursorDot.style.top = `${e.clientY}px`;

            cursorOutline.animate({
                left: `${e.clientX}px`,
                top: `${e.clientY}px`
            }, { duration: 500, fill: "forwards" });
        });

        /* 인풋 위에서 커서 점을 흐리게 */
        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('mouseenter', () => { cursorDot.style.opacity = '0.4'; });
            el.addEventListener('mouseleave', () => { cursorDot.style.opacity = '1'; });
        });

        /* =========================================
           [JavaScript 파트 2] Three.js 파티클 배경 - login.html과 동일
        ========================================= */
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.04);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 18;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        /* 파란 파티클 */
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1200;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 60;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.07, color: 0x00d4ff,
            transparent: true, opacity: 0.75,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        /* 분홍 보조 파티클 */
        const posArray2 = new Float32Array(600 * 3);
        for (let i = 0; i < 600 * 3; i++) posArray2[i] = (Math.random() - 0.5) * 70;
        const geo2 = new THREE.BufferGeometry();
        geo2.setAttribute('position', new THREE.BufferAttribute(posArray2, 3));
        const mat2 = new THREE.PointsMaterial({
            size: 0.05, color: 0xff00c8,
            transparent: true, opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(geo2, mat2));

        /* 홀로그램 링 오브젝트 */
        const ringGroup = new THREE.Group();
        scene.add(ringGroup);
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const geo = new THREE.TorusGeometry(1.2 + Math.random() * 0.5, 0.02, 8, 60);
            const mat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(i / 8, 1, 0.5),
                transparent: true, opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(geo, mat);
            ring.position.x = Math.cos(angle) * 12;
            ring.position.z = Math.sin(angle) * 12;
            ring.position.y = Math.sin(angle * 2) * 2;
            ring.rotation.x = Math.PI / 2;
            ringGroup.add(ring);
        }

        /* 애니메이션 루프 */
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            particlesMesh.rotation.y = t * 0.04;
            particlesMesh.position.y = Math.sin(t * 0.4) * 1.5;
            ringGroup.rotation.y = t * 0.06;
            ringGroup.children.forEach((ring, idx) => {
                ring.position.y = Math.sin(t * 1.2 + idx) * 1.5;
                ring.rotation.z = t * 0.3 + idx;
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        /* =========================================
           [JavaScript 파트 3] 회원가입 로직
           ★ 원본 register() 함수 코드를 100% 그대로 유지합니다.
        ========================================= */
        function register() {
            let form = document.getElementById('registerForm');
            let formData = new FormData(form);

            fetch('/auth/register', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    if (data.success) {
                        window.location.href = '/auth/login'; // 성공하면 로그인 화면으로 이동
                    }
                });
        }
    </script>
</body>

</html>
