<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - ALL IN ONE</title>
    <meta name="description" content="동아리 통합 게시판 ALL IN ONE 회원가입 페이지">
    <link rel="stylesheet" href="/static/registerPage_/register.css">
</head>

<body>

    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}


    <!-- 커스텀 커서 일단 죽임
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    -->

    <!-- Three.js 파티클 -->
    <div id="canvas-container"></div>

    <!-- 회원가입 카드 -->
    <div id="register-wrapper">
        <div class="register-card">

            <!-- 카드 헤더: 로고 + 제목 -->
            <div class="card-header">
                <div class="card-logo">ALL IN ONE</div>
                <h1 class="card-title">회원가입</h1>
            </div>

            <form id="registerForm">

                <!-- 계정 정보 -->
                <div class="form-section-title">계정 정보</div>

                <div class="form-group">
                    <label for="user_id">아이디</label>
                    <input type="text" name="user_id" id="user_id" placeholder="사용할 아이디를 입력하세요">
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요">
                </div>

                <!-- 개인 정보 -->
                <div class="form-section-title">개인 정보</div>

                <!-- 이름 + 나이 -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" name="name" id="name" placeholder="홍길동">
                    </div>
                    <div class="form-group">
                        <label for="age">나이</label>
                        <input type="number" name="age" id="age" placeholder="예: 22">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">연락처</label>
                    <input type="text" name="phone" id="phone" placeholder="010-0000-0000">
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" name="email" id="email" placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="address">거주지 주소</label>
                    <input type="text" name="address" id="address" placeholder="주소를 입력하세요">
                </div>

                <!-- 학적 정보 -->
                <div class="form-section-title">학적 정보</div>

                <div class="form-group">
                    <label for="student_id">학번</label>
                    <input type="text" name="student_id" id="student_id" placeholder="예: 20261234">
                </div>

                <!-- 학년 + 입학년도 -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="grade">학년</label>
                        <input type="number" name="grade" id="grade" placeholder="1 ~ 4">
                    </div>
                    <div class="form-group">
                        <label for="admission_year">입학년도</label>
                        <input type="number" name="admission_year" id="admission_year" placeholder="예: 2026">
                    </div>
                </div>

                <button type="button" class="btn-register" onclick="register()">
                    가입하기
                </button>
            </form>

            <div class="card-footer">
                이미 계정이 있으신가요?&nbsp;
                <a href="/auth/login">로그인</a>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/registerPage_/register.js"></script>
</body>

</html>
