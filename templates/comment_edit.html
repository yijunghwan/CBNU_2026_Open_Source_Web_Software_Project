<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>댓글 수정</title>
</head>
<body>
    {% include '_navbar.html' %}

    <h1>댓글 수정</h1>

    {% if message %}
        <p>
            {% if message_type == 'error' %}[오류]{% elif message_type == 'success' %}[완료]{% else %}[알림]{% endif %}
            {{ message }}
        </p>
    {% endif %}

    <form method="post" action="{{ url_for('board.edit_comment', Comment_id=comment.id) }}">
        <p>
            <textarea name="content" rows="5" cols="80" required>{{ comment.content }}</textarea>
        </p>
        <button type="submit">댓글 수정 저장</button>
    </form>

    <form method="post" action="{{ url_for('board.delete_comment', Comment_id=comment.id) }}" onsubmit="return confirm('정말 이 댓글을 삭제하시겠습니까?');">
        <button type="submit" style="color: red;">댓글 삭제</button>
    </form>

    <p><a href="{{ url_for('board.board_post', post_id=comment.post_id) }}">게시글로 돌아가기</a></p>
</body>
</html>
