<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='board_edit.css') }}">
</head>
<body>
    {% include '_navbar.html' %}

    <div class="layout">
        <div class="edit">

            <div class="header">
                <h1>게시글 수정</h1>
            </div>

            {% if message %}
                <p class="message">
                    {% if message_type == 'error' %}[오류]{% elif message_type == 'success' %}[완료]{% else %}[알림]{% endif %}
                    {{ message }}
                </p>
            {% endif %}

            <form method="post" action="{{ url_for('board.edit_post', post_id=post.id) }}" class="edit-area">
                <div class="title">
                    <label for="title">제목</label>
                    <input id="title" name="title" type="text" maxlength="150" value="{{ post.title }}" required>
                </div>

                <div class="content">
                    <label for="content">내용</label>
                    <textarea id="content" name="content" rows="12" required>{{ post.content }}</textarea>
                </div>

                <div class="select">
                    <label for="post_type">글 유형</label>
                    <select id="post_type" name="post_type">
                        <option value="" {% if not post.post_type %}selected{% endif %}>자유(유형없음)</option>
                        {% for item in post_types %}
                            <option value="{{ item }}" {% if post.post_type == item %}selected{% endif %}>{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="check-area">
                    <label>
                        <input type="checkbox" name="is_public" value="1" {% if post.is_public == 1 %}checked{% endif %}>
                        공개글
                    </label>

                    {% if can_notice %}
                        <label>
                            <input type="checkbox" name="is_notice" value="1" {% if post.is_notice == 1 %}checked{% endif %}>
                            공지글
                        </label>
                    {% else %}
                        <p>공지글 설정은 간부 이상만 가능합니다.</p>
                        <input type="hidden" name="is_notice" value="0">
                    {% endif %}
                </div>

                <div class="button">
                    <a href="{{ url_for('board.board_post', post_id=post.id) }}" class="cancel-button">상세로 돌아가기</a>

                    <div class="right-button">
                        <button type="submit" class="delete-button" form="delete-form">게시글 삭제</button>
                        <button type="submit" class="submit-button">수정 저장</button>
                    </div>
                </div>
            </form>

            <form id="delete-form"
                  method="post"
                  action="{{ url_for('board.delete_post', post_id=post.id) }}"
                  onsubmit="return confirm('정말 이 게시글을 삭제하시겠습니까?');">
            </form>

        </div>
    </div>
</body>
</html>
