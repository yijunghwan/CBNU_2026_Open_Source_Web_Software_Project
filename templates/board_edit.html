<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
    {% include '_navbar.html' %}

    <h1>게시글 수정</h1>

    {% if message %}
        <p>
            {% if message_type == 'error' %}[오류]{% elif message_type == 'success' %}[완료]{% else %}[알림]{% endif %}
            {{ message }}
        </p>
    {% endif %}

    <form method="post" action="{{ url_for('board.edit_post', Post_id=post.id) }}">
        <p>
            <label for="title">제목</label><br>
            <input id="title" name="title" type="text" maxlength="150" value="{{ post.title }}" required>
        </p>

        <p>
            <label for="content">내용</label><br>
            <textarea id="content" name="content" rows="12" cols="80" required>{{ post.content }}</textarea>
        </p>

        <p>
            <label for="post_type">글 유형</label><br>
            <select id="post_type" name="post_type">
                <option value="" {% if not post.post_type %}selected{% endif %}>자유(유형없음)</option>
                {% for item in post_types %}
                    <option value="{{ item }}" {% if post.post_type == item %}selected{% endif %}>{{ item }}</option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label>
                <input type="checkbox" name="is_public" value="1" {% if post.is_public == 1 %}checked{% endif %}> 공개글
            </label>
        </p>

        {% if can_notice %}
            <p>
                <label>
                    <input type="checkbox" name="is_notice" value="1" {% if post.is_notice == 1 %}checked{% endif %}> 공지글
                </label>
            </p>
        {% else %}
            <p>공지글 설정은 간부 이상만 가능합니다.</p>
            <input type="hidden" name="is_notice" value="0">
        {% endif %}

        <button type="submit">수정 저장</button>
    </form>

    <form method="post" action="{{ url_for('board.delete_post', Post_id=post.id) }}" onsubmit="return confirm('정말 이 게시글을 삭제하시겠습니까?');">
        <button type="submit" style="color: red;">게시글 삭제</button>
    </form>

    <p><a href="{{ url_for('board.board_post', post_id=post.id) }}">상세로 돌아가기</a></p>
</body>
</html>
