<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 (회장)</title>
    <style>
        /* ── 페이지 진입 애니메이션 키프레임 정의 ── */

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 관리 메뉴 아이템 팝업 효과 (스케일 업) */
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05070d;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            color: #eee;
            min-height: 100vh;
        }

        .page-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* ── 페이지 헤더 ── */
        .page-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            animation: fadeInDown 0.5s ease both;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00d4ff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .crown-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15), rgba(255, 160, 0, 0.1));
            border: 1px solid rgba(255, 193, 7, 0.4);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffc107;
            margin-bottom: 10px;
        }

        .user-meta {
            color: #8a93a6;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }

        .user-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-meta span::before {
            content: '•';
            color: #00d4ff;
        }

        /* ── 카드 ── */
        .card {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.7), rgba(15, 15, 15, 0.7));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease both;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.35);
        }

        /* 카드 3개 순차 등장 */
        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.3s;
        }

        /* 관리자 카드 강조 */
        .card.admin-card {
            border-color: rgba(255, 193, 7, 0.3);
            background: linear-gradient(135deg, rgba(40, 30, 10, 0.7), rgba(20, 15, 5, 0.7));
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 16px;
            background: linear-gradient(180deg, #00d4ff, #ff00c8);
            border-radius: 2px;
        }

        .card.admin-card .card-title::before {
            background: linear-gradient(180deg, #ffc107, #ff8c00);
        }

        /* ── 정보 행 ── */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .info-row:last-of-type {
            border-bottom: none;
        }

        .info-label {
            color: #8a93a6;
        }

        .info-value {
            color: #fff;
            font-weight: 500;
        }

        .member-count-badge {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 4px 14px;
            color: #00d4ff;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ── 관리 메뉴 그리드 ── */
        .admin-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* 관리자 카드 호버: 컴마로 떠오르면서 노란 글로우 */
        .card.admin-card:hover {
            border-color: rgba(255, 193, 7, 0.6);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 193, 7, 0.15);
        }

        .admin-menu-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding: 18px;
            background: rgba(255, 193, 7, 0.05);
            border: 1px solid rgba(255, 193, 7, 0.2);
            border-radius: 10px;
            cursor: pointer;
            /* hover 전환은 transition으로, 등장은 popIn 애니메이션으로 */
            transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            animation: popIn 0.4s ease both;
            text-align: left;
            font-family: inherit;
            color: inherit;
        }

        /* 두 메뉴 아이템이 시간 차를 두고 나타나도록 */
        .admin-menu-item:nth-child(1) {
            animation-delay: 0.35s;
        }

        .admin-menu-item:nth-child(2) {
            animation-delay: 0.45s;
        }

        .admin-menu-item:hover {
            background: rgba(255, 193, 7, 0.1);
            border-color: rgba(255, 193, 7, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 193, 7, 0.15);
        }

        .admin-menu-icon {
            font-size: 1.4rem;
        }

        .admin-menu-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }

        .admin-menu-desc {
            font-size: 0.75rem;
            color: #8a93a6;
        }

        /* ── 버튼 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #00d4ff;
        }

        .btn-outline:hover {
            background: rgba(0, 212, 255, 0.08);
            border-color: #00d4ff;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .admin-menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}

    <div class="page-container">
        <!-- 페이지 헤더 -->
        <div class="page-header">
            <div class="crown-badge">👑 회장</div>
            <h1>{{ user.name }}님의 마이페이지</h1>
            <div class="user-meta">
                <span>아이디: {{ user.user_id }}</span>
                <span>학번: {{ user.student_id }}</span>
                <span>레벨: {{ user.role_level }}</span>
            </div>
        </div>

        <!-- 동아리 소속 카드 -->
        <div class="card">
            <div class="card-title">동아리 소속 정보</div>
            <div class="info-row">
                <span class="info-label">소속 동아리</span>
                <span class="info-value">{{ user.belonging_club }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">동아리 인원</span>
                <span class="member-count-badge">{{ count }}명</span>
            </div>
        </div>

        <!-- 회장 관리자 메뉴 카드 -->
        <div class="card admin-card">
            <div class="card-title">회장 관리자 메뉴</div>
            <div class="admin-menu-grid">
                <button class="admin-menu-item" onclick="location.href='/club/admin/club'">
                    <span class="admin-menu-icon">👥</span>
                    <span class="admin-menu-label">신청자 / 부원 관리</span>
                    <span class="admin-menu-desc">가입 신청 처리 및 동아리원 관리</span>
                </button>
                <button class="admin-menu-item" onclick="location.href='/ta/chat'">
                    <span class="admin-menu-icon">💬</span>
                    <span class="admin-menu-label">조교단 소통방</span>
                    <span class="admin-menu-desc">조교단 다이렉트 소통방</span>
                </button>
            </div>
        </div>

        <!-- 계정 관리 카드 -->
        <div class="card">
            <div class="card-title">계정 관리</div>
            <div class="action-row">
                <button class="btn btn-outline" onclick="location.href='/user/change_info'">내 정보 수정</button>
                <button class="btn btn-ghost" onclick="location.href='/auth/logout'">로그아웃</button>
            </div>
        </div>
    </div>
</body>

</html>
