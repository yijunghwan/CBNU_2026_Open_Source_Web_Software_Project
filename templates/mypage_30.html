<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 (회장) - ALL IN ONE</title>
    <meta name="description" content="ALL IN ONE 마이페이지 - 회장 관리 및 계정 정보">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* ── 키프레임 ── */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(36px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 관리 메뉴 아이템 팝업 효과 */
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                box-shadow: 0 0 24px rgba(0, 212, 255, 0.15), 0 0 60px rgba(0, 212, 255, 0.05);
            }

            50% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.32), 0 0 90px rgba(0, 212, 255, 0.1);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05070d;
            font-family: 'Inter', 'Pretendard', 'Noto Sans KR', sans-serif;
            color: #eee;
            min-height: 100vh;
        }

        /* ── 페이지 컨테이너 ── */
        .page-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 32px 80px;
        }

        /* ── 프로필 배너 헤더 ── */
        .page-header {
            position: relative;
            margin-bottom: 48px;
            padding: 52px 56px;
            border-radius: 24px;
            background: linear-gradient(135deg,
                    rgba(0, 212, 255, 0.08) 0%,
                    rgba(10, 10, 25, 0.92) 50%,
                    rgba(255, 0, 200, 0.06) 100%);
            border: 1px solid rgba(0, 212, 255, 0.2);
            overflow: hidden;
            animation: fadeInDown 0.55s ease both, glowPulse 4s ease-in-out infinite;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -70px;
            right: -70px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.14) 0%, transparent 70%);
            pointer-events: none;
        }

        .page-header::after {
            content: '';
            position: absolute;
            bottom: -90px;
            left: -50px;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(255, 0, 200, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── 회장 크라운 배지 ── */
        .crown-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 16px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.18), rgba(255, 160, 0, 0.12));
            border: 1px solid rgba(255, 193, 7, 0.45);
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffc107;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .page-header h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #00d4ff 0%, #a78bfa 50%, #ff00c8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 4s linear infinite;
            margin-bottom: 18px;
            line-height: 1.2;
        }

        .user-meta {
            color: #8a93a6;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 28px;
        }

        .user-meta span {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 1rem;
        }

        .user-meta span::before {
            content: '▸';
            color: #00d4ff;
            font-size: 0.85rem;
        }

        /* ── 카드 공통 ── */
        .card {
            background: linear-gradient(145deg, rgba(20, 22, 35, 0.85), rgba(10, 10, 20, 0.9));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 20px;
            padding: 44px 48px;
            margin-bottom: 28px;
            animation: fadeInUp 0.5s ease both;
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6), 0 0 32px rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.35);
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.22s;
        }

        .card:nth-child(3) {
            animation-delay: 0.34s;
        }

        /* ── 관리자 카드 강조 ── */
        .card.admin-card {
            border-color: rgba(255, 193, 7, 0.3);
            background: linear-gradient(145deg, rgba(40, 32, 10, 0.85), rgba(20, 16, 5, 0.9));
        }

        .card.admin-card:hover {
            border-color: rgba(255, 193, 7, 0.6);
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6), 0 0 32px rgba(255, 193, 7, 0.15);
        }

        /* ── 카드 타이틀 ── */
        .card-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.3px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #00d4ff, #ff00c8);
            border-radius: 3px;
            flex-shrink: 0;
        }

        .card.admin-card .card-title::before {
            background: linear-gradient(180deg, #ffc107, #ff8c00);
        }

        /* ── 인원 수 배지 ── */
        .member-count-badge {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.35);
            border-radius: 30px;
            padding: 6px 18px;
            color: #00d4ff;
            font-size: 1rem;
            font-weight: 700;
        }

        /* ── 정보 행 ── */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 1.05rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #8a93a6;
            font-size: 1rem;
            font-weight: 500;
            min-width: 130px;
        }

        .info-value {
            color: #f0f4ff;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* ── 관리 메뉴 그리드 ── */
        .admin-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .admin-menu-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding: 24px;
            background: rgba(255, 193, 7, 0.05);
            border: 1px solid rgba(255, 193, 7, 0.22);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.22s, border-color 0.22s, transform 0.22s, box-shadow 0.22s;
            animation: popIn 0.4s ease both;
            text-align: left;
            font-family: inherit;
            color: inherit;
        }

        .admin-menu-item:nth-child(1) {
            animation-delay: 0.38s;
        }

        .admin-menu-item:nth-child(2) {
            animation-delay: 0.48s;
        }

        .admin-menu-item:hover {
            background: rgba(255, 193, 7, 0.1);
            border-color: rgba(255, 193, 7, 0.55);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 193, 7, 0.18);
        }

        .admin-menu-icon {
            font-size: 1.8rem;
        }

        .admin-menu-label {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .admin-menu-desc {
            font-size: 0.85rem;
            color: #8a93a6;
            line-height: 1.4;
        }

        /* ── 버튼 공통 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 15px 32px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s;
            border: none;
            font-family: inherit;
            letter-spacing: 0.2px;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(0, 212, 255, 0.45);
            color: #00d4ff;
        }

        .btn-outline:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            box-shadow: 0 0 22px rgba(0, 212, 255, 0.28);
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: #ccc;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ── 액션 행 ── */
        .action-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        /* ── 반응형 ── */
        @media (max-width: 768px) {
            .page-container {
                padding: 32px 16px 60px;
            }

            .page-header {
                padding: 36px 28px;
            }

            .page-header h1 {
                font-size: 2.1rem;
            }

            .card {
                padding: 32px 24px;
            }

            .btn {
                padding: 13px 22px;
                font-size: 0.95rem;
            }

            .admin-menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}

    <div class="page-container">
        <!-- 페이지 헤더 -->
        <div class="page-header">
            <div class="crown-badge">👑 회장</div>
            <h1>{{ user.name }}님의 마이페이지</h1>
            <div class="user-meta">
                <span>아이디: {{ user.user_id }}</span>
                <span>학번: {{ user.student_id }}</span>
                <span>레벨: {{ user.role_level }}</span>
            </div>
        </div>

        <!-- 동아리 소속 카드 -->
        <div class="card">
            <div class="card-title">동아리 소속 정보</div>
            <div class="info-row">
                <span class="info-label">소속 동아리</span>
                <span class="info-value">{{ user.belonging_club }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">동아리 인원</span>
                <span class="member-count-badge">{{ count }}명</span>
            </div>
        </div>

        <!-- 회장 관리자 메뉴 카드 -->
        <div class="card admin-card">
            <div class="card-title">회장 관리자 메뉴</div>
            <div class="admin-menu-grid">
                <button class="admin-menu-item" onclick="location.href='/club/admin/club'">
                    <span class="admin-menu-icon">👥</span>
                    <span class="admin-menu-label">신청자 / 부원 관리</span>
                    <span class="admin-menu-desc">가입 신청 처리 및 동아리원 관리</span>
                </button>
            </div>
        </div>

        <!-- 계정 관리 카드 -->
        <div class="card">
            <div class="card-title">계정 관리</div>
            <div class="action-row">
                <button class="btn btn-outline" onclick="location.href='/user/change_info'">내 정보 수정</button>
                <button class="btn btn-outline" onclick="location.href='/board/my-posts'">내가 쓴 글</button>
                <button class="btn btn-ghost" onclick="location.href='/auth/logout'">로그아웃</button>
            </div>
        </div>
    </div>
</body>

</html>
