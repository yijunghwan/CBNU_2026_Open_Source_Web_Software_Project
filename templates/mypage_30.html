<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>마이페이지 (회장)</title>
</head>

<body>
    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}

    <h1>{{ user.name }} 회장님의 마이페이지</h1>
    <p>DB 고유번호(PK): {{ user.id }} | 아이디: {{ user.user_id }} | 학번: {{ user.student_id }} | 레벨: {{ user.role_level }}</p>
    <hr>

    <h2>동아리 소속 정보: {{ user.belonging_club }}</h2>
    <p>우리 동아리 인원수: {{ count }}명</p>

    <div style="border: 2px solid red; padding: 10px; margin-top: 10px;">
        <h3>회장 관리자 메뉴</h3>
        <button onclick="location.href='/club/admin/club'">동아리 신청자/부원 관리 페이지</button>
        <button onclick="location.href='/ta/chat'">조교단 다이렉트 소통방</button>
    </div>

    <hr>
    <button onclick="location.href='/user/change_info'">내 정보 수정</button>
    <button onclick="location.href='/auth/logout'">로그아웃</button>
</body>

</html>
