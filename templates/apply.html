<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>동아리 가입 신청</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='apply.css') }}">
</head>
<body>
    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}
    <div class="layout">
        <div class="write">
            <div class="header">
                <h1>동아리 가입 신청서</h1>
                <p>환영합니다, {{ user.name }}님! 지원할 동아리를 선택하고 각오를 남겨주세요.</p>
            </div>

            <form id="applyForm" class="write-area">
                <div class="select">
                    <label for="club_id">지원할 동아리</label>
                    <select name="club_id" id="club_id" required>
                        {% for club in clubs %}
                            <option value="{{ club.id }}">{{ club.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="content">
                    <label for="memo">회장님께 남길 코멘트 (가입 동기/각오)</label>
                    <textarea name="memo" id="memo" placeholder="예: 열심히 활동하겠습니다!" required></textarea>
                </div>

                <div class="button">
                    <a href="/user/mypage" class="cancel-button">돌아가기</a>
                    <button type="button" class="submit-button" onclick="submitApplication()">가입 신청서 제출하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function submitApplication() {
            let form = document.getElementById('applyForm');
            let formData = new FormData(form);

            // POST 방식으로 데이터 전송
            fetch('/user/apply_0', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    if(data.success) {
                        window.location.href = '/user/mypage'; // 성공하면 다시 마이페이지로 이동
                    }
                });
        }
    </script>
    
</body>
</html>
