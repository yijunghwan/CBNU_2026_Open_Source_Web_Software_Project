<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>내 정보 수정</title>
</head>
<body>
    {% set active_page = 'mypage' %}
    {% include '_navbar.html' %}

    <h1>내 정보 수정</h1>

    {% if not verified %}
        <p>정보 수정을 위해 비밀번호를 다시 입력해주세요.</p>
        <form id="verifyForm">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">확인</button>
        </form>
    {% else %}
        <p>수정할 정보를 입력한 뒤 저장해주세요.</p>
        <form id="changeForm">
            <div>
                <label for="name">이름</label>
                <input type="text" id="name" name="name" value="{{ user.name }}" required>
            </div>
            <div>
                <label for="age">나이</label>
                <input type="number" id="age" name="age" value="{{ user.age }}" min="0" required>
            </div>
            <div>
                <label for="phone">휴대폰번호</label>
                <input type="text" id="phone" name="phone" value="{{ user.phone }}" required>
            </div>
            <div>
                <label for="grade">학년</label>
                <input type="number" id="grade" name="grade" value="{{ user.grade }}" min="1" max="8" required>
            </div>
            <div>
                <label for="admission_year">입학년도</label>
                <input type="number" id="admission_year" name="admission_year" value="{{ user.admission_year }}" min="1900" required>
            </div>
            <div>
                <label for="address">주소</label>
                <input type="text" id="address" name="address" value="{{ user.address }}" required>
            </div>
            <div>
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
            </div>
            <div>
                <label for="off">휴학여부</label>
                <select id="off" name="off" required>
                    <option value="0" {% if user.off == 0 %}selected{% endif %}>재학(0)</option>
                    <option value="1" {% if user.off == 1 %}selected{% endif %}>휴학(1)</option>
                </select>
            </div>
            {% if user.role_level >= 40 %}
            <div>
                <label for="belonging_club">소속 동아리(권한 40 전용)</label>
                <select id="belonging_club" name="belonging_club" required>
                    <option value="N" {% if user.belonging_club == 'N' %}selected{% endif %}>없음(N)</option>
                    {% for club_name in club_names %}
                        <option value="{{ club_name }}" {% if user.belonging_club == club_name %}selected{% endif %}>{{ club_name }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <button type="submit">저장</button>
        </form>
    {% endif %}

    <hr>
    <button type="button" onclick="location.href='/user/mypage'">마이페이지로 돌아가기</button>

    <script>
        const verifyForm = document.getElementById('verifyForm');
        if (verifyForm) {
            verifyForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const formData = new FormData(verifyForm);

                fetch('/user/change_info', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    if (data.success) {
                        window.location.href = data.redirect || '/user/change_info';
                    }
                });
            });
        }

        const changeForm = document.getElementById('changeForm');
        if (changeForm) {
            changeForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const formData = new FormData(changeForm);

                fetch('/user/change_info', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    if (data.success) {
                        window.location.href = '/user/mypage';
                    }
                });
            });
        }
    </script>
</body>
</html>
