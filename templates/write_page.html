<!DOCTYPE html>
<html>
  <head>
    <title>글쓰기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='write_page.css') }}" />
  </head>
  <body>
    <div class="write_page">
      <h2>글쓰기</h2>
      <hr class="hr" />
      <div class="select">
        <p>게시판</p>
        <select>
          <option>통합 게시판</option>
          <option>홍보 게시판</option>
        </select>
      </div>
      <hr class="hr" />
      <div class="title">
        <p>제목</p>
        <input type="text" placeholder="제목을 입력하세요" />
      </div>
      <hr class="hr" />
      <div class="content">
        <p>내용</p>
        <textarea placeholder="내용을 입력하세요"></textarea>
      </div>
      <hr class="hr" />
      <div class="edit">
        <div class="font">
          <input type="color" class="font-color" />
          <select class="font-size">
            <option>12</option>
            <option>14</option>
            <option>16</option>
            <option>18</option>
            <option>20</option>
          </select>
        </div>
        <div class="line"></div>
        <div class="style">
          <button><b>B</b></button>
          <button><i>I</i></button>
          <button><u>U</u></button>
          <button><s>S</s></button>
        </div>
        <div class="line"></div>
        <div class="file">
          <button>🔗</button>
          <button>🖼️</button>
          <button>📎</button>
        </div>
      </div>
      <hr class="hr" />
      <div class="result">
        <button class="create-button" onclick="CreateWrite()">등록</button>
        <button class="cancel-button" onclick="CloseWrite()">취소</button>
      </div>
    </div>
    <script src="{{ url_for('static', filename='write_page.js') }}"></script>
  </body>
</html>
